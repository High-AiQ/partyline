[adapter]
name = "Codex"
version = "1.3.0"
description = "Interactive Codex terminal with rollout and thread-history transcript tailing."
entrypoint = "adapter.py"
class = "PartylineAdapter"
command = ["codex"]
requires = ["codex"]
# Probed with Codex CLI 0.149.0 on 2026-08-23; re-probe after CLI updates.
compact_paste = "/compact"
env_unset = []
# Codex 0.156 sandboxes commands with bubblewrap, which cannot nest inside the
# write fence (verified 2026-09-22): the fence replaces it, applied only while
# the process is actually fenced.
fence_args = ["--dangerously-bypass-approvals-and-sandbox"]
# The shared home the per-attachment CODEX_HOME symlinks into: a folder-trust
# decision writes through those links to the real config.toml.
capabilities = { resume = true, turn_end = "receipt", transcript = true }
delivery_proof = "transcript-user-record"
delivery_proof_test = "tests/test_jsonl_receipts.py::test_codex_response_item_user_message_proves_paste"
update_command = ["codex", "update"]
