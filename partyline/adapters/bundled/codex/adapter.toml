[adapter]
name = "Codex"
version = "1.0.3"
description = "Interactive Codex terminal with rollout transcript tailing."
entrypoint = "adapter.py"
class = "PartylineAdapter"
command = ["codex"]
requires = ["codex"]
# Probed with Codex CLI 0.149.0 on 2026-08-23; re-probe after CLI updates.
compact_paste = "/compact"
env_unset = []
capabilities = { resume = true, turn_end = "receipt", transcript = true }
update_command = ["codex", "update"]
