[adapter]
name = "Claude Code"
version = "1.0.0"
description = "Interactive Claude Code terminal with JSONL transcript tailing."
entrypoint = "adapter.py"
class = "PartylineAdapter"
command = ["claude"]
requires = ["claude"]
# Probed with Claude Code 2.1.238 on 2026-08-23; re-probe after CLI updates.
compact_paste = "/compact"
# Don't let the spawned CLI think it is nested inside another harness.
env_unset = ["CLAUDECODE", "CLAUDE_CODE_*"]
capabilities = { resume = true, turn_end = "receipt" }
update_command = ["claude", "update"]
