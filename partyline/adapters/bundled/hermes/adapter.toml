[adapter]
name = "Hermes"
version = "1.0.0"
description = "SQLite transcript adapter for the Hermes interactive terminal application."
entrypoint = "adapter.py"
command = ["hermes", "--cli", "--pass-session-id"]
requires = ["hermes"]
# Probed with Hermes 0.20.0 on 2026-08-23; re-probe after CLI updates.
compact_paste = "/compress"
env_unset = []
output = "read-only SQLite session transcript"

update_command = ["hermes", "update"]

[adapter.capabilities]
resume = true
# Its speech is trusted only from a transcript it has claimed by content.
transcript = true
