[adapter]
name = "Hermes"
version = "1.0.0"
description = "SQLite transcript adapter for the Hermes interactive terminal application."
entrypoint = "adapter.py"
command = ["hermes", "--cli", "--pass-session-id"]
requires = ["hermes"]
# Probed with Hermes 0.20.0 on 2026-08-23; re-probe after CLI updates.
compact_paste = "/compress"
env_unset = []
# hermes's home (HERMES_HOME default); the claimed state.db transcript lives in it.
output = "read-only SQLite session transcript"
delivery_proof = "none-with-reason"
delivery_proof_reason = "No local Hermes session was available to validate a user-input record; assistant transcript rows provide the weaker delivery boundary."
delivery_proof_test = "tests/test_bundled_adapters.py::test_assistant_rows_credit_without_ending_presence"

update_command = ["hermes", "update"]

[adapter.capabilities]
resume = true
# Its speech is trusted only from a transcript it has claimed by content.
transcript = true
