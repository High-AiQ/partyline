[adapter]
name = "Cursor"
version = "1.0.0"
description = "Interactive Cursor Agent CLI (`agent`) with JSONL transcript tailing."
entrypoint = "adapter.py"
class = "PartylineAdapter"
command = ["agent", "--yolo", "--trust"]
requires = ["agent"]
# Probed with Cursor Agent v2026.08.11-e8db854 on 2026-08-23; re-probe after updates.
# The embedded newline selects the slash-menu item; the base paste adds submit.
compact_paste = "/summarize\n"
env_unset = []
# Chats keyed by cwd hash and per-workspace trust state.
# immediate_mentions: a paste into a busy `agent` is only a queued steer until a
# second Enter submits it into the run (Cursor CLI docs, probed 2026-09-14); the
# adapter sends that Enter. `@!name` is one Ctrl+C, confirmed by the transcript's
# turn-end record. Escape cancels a queued steer, not the turn.
capabilities = { resume = true, turn_end = "receipt", transcript = true, immediate_mentions = true }
update_command = ["agent", "update"]
