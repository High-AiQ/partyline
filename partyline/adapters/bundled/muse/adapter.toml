[adapter]
name = "Muse Code"
version = "1.0.2"
description = "Interactive Muse Code terminal with durable session-log tailing."
entrypoint = "adapter.py"
class = "PartylineAdapter"
command = ["muse", "--yolo"]
requires = ["muse"]
env_unset = []
capabilities = { resume = true }
update_command = ["bash", "-lc", "curl -fsSL https://dev.meta.ai/install.sh | bash"]
