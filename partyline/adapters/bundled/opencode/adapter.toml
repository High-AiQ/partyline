[adapter]
name = "OpenCode"
version = "1.0.0"
description = "Tails completed assistant text from OpenCode's local session store."
entrypoint = "adapter.py"
command = ["opencode"]
requires = ["opencode"]
env_unset = []
# Local session store and shared app state.
output = "local session transcript"

update_command = ["opencode", "upgrade"]

[adapter.capabilities]
resume = true
turn_end = "receipt"
# Its speech is trusted only from a transcript it has claimed by content.
transcript = true
