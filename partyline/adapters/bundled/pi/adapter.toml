[adapter]
name = "pi"
version = "1.0.0"
description = "The pi coding agent. Pins --session-id/--session-dir and tails the JSONL transcript."
entrypoint = "adapter.py"
class = "PartylineAdapter"
command = ["pi"]
requires = ["pi"]
# Probed with pi 0.83.0 on 2026-08-23; re-probe after CLI updates.
compact_paste = "/compact"
env_unset = []
output = "session transcript"

update_command = ["pi", "update", "--self"]

[adapter.capabilities]
# Re-attaching reuses the same --session-id, so the process comes back with context.
resume = true
# Its speech is trusted only from a transcript it has claimed by content.
transcript = true
