[adapter]
name = "OpenCode v2"
version = "1.0.0"
description = "Interactive OpenCode v2 with a private server and structured session transcripts."
entrypoint = "adapter.py"
command = ["opencode2"]
requires = ["opencode2"]
env_unset = []
output = "local session transcript"
delivery_proof = "transcript-user-record"
delivery_proof_test = "tests/test_opencode_v2_adapter.py::test_wake_receipt_requires_recorded_user_marker"
# Update the separate install prefix explicitly; a global upgrade can replace v1.

[adapter.capabilities]
resume = true
turn_end = "receipt"
transcript = true
