name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: lint
        run: uv run --locked ruff check .
      - name: test with coverage
        run: uv run --locked coverage run -m unittest discover -s tests && uv run --locked coverage report

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The same command a person runs locally, so CI can never be stricter or
      # laxer than the checkout: format, lint, svelte-check, unit tests.
      - name: verify
        run: npm run verify
        working-directory: frontend
      # partyline/static/ is committed so the app installs without Node, which
      # only works if it is actually the current build. Rebuilding and finding
      # a diff means someone changed the source and shipped the old bundle.
      - name: the committed build matches the source
        run: |
          npm run build --prefix frontend
          if ! git diff --exit-code -- partyline/static; then
            echo "::error::partyline/static/ is stale — run 'npm run build' in frontend/ and commit the result"
            exit 1
          fi

  code-line-limits:
    name: code-line-limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: production source files stay within their line limits
        run: ./check-code-lines

  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: conventional one-liners
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            commits=$(git rev-list --no-merges "origin/$BASE..HEAD")
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            commits=$(git rev-list -1 HEAD)   # forced push or new branch: check the tip only
          else
            commits=$(git rev-list --no-merges "$BEFORE..HEAD")
          fi
          fail=0
          for c in $commits; do
            subject=$(git log -1 --format=%s "$c")
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9_.-]+\))?!?: .+'; then
              echo "FAIL $c — subject is not conventional: $subject"; fail=1
            fi
            if [ "$(git log -1 --format=%B "$c" | grep -c .)" -gt 1 ]; then
              echo "FAIL $c — has a body; one-liner commits only: $subject"; fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "all commits conventional one-liners"
          exit "$fail"

  version-policy:
    name: version-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: require the release version implied by this change set
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: uv run --locked python -m scripts.version_policy --base "$BASE_SHA" --head "$HEAD_SHA"

  tag-version:
    name: tag-version
    if: github.event_name == 'push'
    needs: [backend, frontend, code-line-limits, conventional-commits, version-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: create an immutable tag when the release version changed
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --tags origin
          uv run --locked python -m scripts.tag_version --base "$BASE_SHA" --head "$HEAD_SHA"
