name: checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels that pull request's older run. Pushes
# to main are never cancelled: tag-version must see every one.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-env
      - uses: astral-sh/setup-uv@v6
      # The ffmpeg rescue path for uploads (AVIF and friends) needs a build
      # that can decode the format, and the sandbox tests need bubblewrap. The
      # runner is persistent and cannot install packages, so fail with the
      # package name instead of an opaque test error when one is missing.
      - name: system tools for backend tests are installed
        run: |
          missing=0
          for pair in ffmpeg:ffmpeg bwrap:bubblewrap; do
            tool=${pair%%:*}; package=${pair##*:}
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is not installed on this runner; install the '$package' package"
              missing=1
            fi
          done
          exit "$missing"
      - name: lint
        run: uv run --locked ruff check .
      - name: test with coverage
        run: ./scripts/capped-test --workers 2 && uv run --locked coverage report

  windows-foundations:
    name: windows-foundations
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: native locks and memory limits under a verified Job Object cap
        run: >-
          uv run --locked python scripts/capped-test --
          uv run --locked --extra helper python -m unittest
          tests.test_runtime_lock tests.test_windows_memory tests.test_windows_console
          tests.test_db tests.test_db_concurrency
          tests.test_windows_runtime tests.test_windows_restriction tests.test_windows_private
          tests.test_windows_access tests.test_windows_git tests.test_worktree_paths
          tests.test_windows_command
          tests.test_windows_files
          tests.test_windows_scope tests.test_windows_shell
          tests.test_windows_probe
          tests.test_windows_volumes
          tests.test_windows_platform
          tests.test_windows_startup
          tests.test_windows_uia

  # The frontend check is four jobs so the slow type-aware ESLint run overlaps
  # the quick ones instead of queueing behind them. Branch protection requires
  # the name "frontend", so that name is the aggregate at the end.
  frontend-lint:
    name: frontend-lint
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-env
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      # Type-aware linting spends minutes building the TypeScript model, then
      # milliseconds per file. The content-keyed cache lets a branch re-lint
      # only files whose content changed. A stale lint of an untouched file
      # that depends on a changed type is still caught: svelte-check type-checks
      # everything on every run in frontend-checks. A new key per run saves
      # each result; the prefix keys restore the most recent one.
      - uses: actions/cache@v4
        with:
          path: frontend/.eslintcache
          key: eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.js', 'frontend/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('frontend/package-lock.json', 'frontend/eslint.config.js', 'frontend/tsconfig.json') }}-
            eslint-
      - name: lint
        run: npm run lint:ci
        working-directory: frontend

  # Format, svelte-check and unit tests: the rest of `npm run verify`.
  frontend-checks:
    name: frontend-checks
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-env
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  # partyline/static/ is committed so the app installs without Node, which
  # only works if it is actually the current build. Rebuilding and finding
  # a diff means someone changed the source and shipped the old bundle.
  frontend-bundle:
    name: frontend-bundle
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-env
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - name: the committed build matches the source
        run: |
          npm run build --prefix frontend
          if ! git diff --exit-code -- partyline/static; then
            echo "::error::partyline/static/ is stale — run 'npm run build' in frontend/ and commit the result"
            exit 1
          fi

  # The required check name. It passes only when every frontend job passed, so
  # a skipped or cancelled job cannot read as success.
  frontend:
    name: frontend
    if: always()
    needs: [frontend-lint, frontend-checks, frontend-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: every frontend job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "frontend job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  code-line-limits:
    name: code-line-limits
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
      - name: production source files stay within their line limits
        run: ./check-code-lines

  no-media:
    name: no-media
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Screenshots, mockups and renders never enter this public repo: git keeps
      # every commit, so a file added and then deleted still bloats every clone.
      # Check each commit in the change set, not only the final tree.
      - name: no media or binary assets in any commit
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="HEAD^"   # forced push or new branch: check the tip (and what it merged) only
          fi
          ./scripts/check-no-media --base "$base" --head HEAD

  conventional-commits:
    name: conventional-commits
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: conventional one-liners
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            commits=$(git rev-list --no-merges "origin/$BASE..HEAD")
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            commits=$(git rev-list -1 HEAD)   # forced push or new branch: check the tip only
          else
            commits=$(git rev-list --no-merges "$BEFORE..HEAD")
          fi
          fail=0
          for c in $commits; do
            subject=$(git log -1 --format=%s "$c")
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9_.-]+\))?!?: .+'; then
              echo "FAIL $c — subject is not conventional: $subject"; fail=1
            fi
            # A squash-merge body that is exactly GitHub's auto-generated commit list
            # ("* subject (#PR)") is metadata, not an author-written body. GitHub puts
            # a blank line between subject and list; drop blank lines before judging.
            body=$(git log -1 --format=%B "$c" | tail -n +2 | grep -v '^[[:space:]]*$' || true)
            if printf '%s\n' "$body" | grep -q . && ! printf '%s\n' "$body" | grep -qvE '^\* (feat|fix|docs|refactor|test|chore)(\([a-z0-9_.-]+\))?!?: .+( \(#[0-9]+\))?$'; then
              body=""
            fi
            if printf '%s\n' "$body" | grep -q .; then
              echo "FAIL $c — has a body; one-liner commits only: $subject"; fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "all commits conventional one-liners"
          exit "$fail"

  version-policy:
    name: version-policy
    runs-on: [self-hosted, linux, partyline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-env
      - uses: astral-sh/setup-uv@v6
      - name: require the release version implied by this change set
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: uv run --locked python -m scripts.version_policy --base "$BASE_SHA" --head "$HEAD_SHA"

  tag-version:
    name: tag-version
    if: github.event_name == 'push'
    needs: [backend, windows-foundations, frontend, code-line-limits, no-media, conventional-commits, version-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch the Windows installer build for a new tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: create an immutable tag when the release version changed
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --tags origin
          uv run --locked python -m scripts.tag_version --base "$BASE_SHA" --head "$HEAD_SHA"
      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so ask for the installer explicitly.
      - name: build the Windows installer for a new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git tag --points-at "$GITHUB_SHA" 'v*' | head -n 1)
          if [ -n "$tag" ]; then
            gh workflow run windows-installer.yml --ref main -f tag="$tag"
          else
            echo "no version tag on this commit; no installer release needed"
          fi
