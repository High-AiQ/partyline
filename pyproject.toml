[project]
name = "partyline"
dynamic = ["version"]
description = "A chatroom for humans and interactive processes, routed with @mentions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn[standard]>=0.29",
    "pyte>=0.8",
]

[project.scripts]
partyline = "partyline.server:main"

[dependency-groups]
dev = [
    "coverage>=7.4",
    "httpx>=0.27", # fastapi TestClient
    "websockets>=12", # websocket lifecycle tests
    "ruff>=0.6",
    "playwright>=1.62.0",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests must point PARTYLINE_DB at a temp file before importing the server, which
# reads it at import time. That is a deliberate import-order exception.
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["partyline"]
branch = true

[tool.coverage.report]
# Nothing is omitted: a coverage number that excludes the hard files is not a
# coverage number. Uncoverable lines are marked in place with `pragma: no cover`
# and each one has to justify itself in review.
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "partyline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["partyline"]
